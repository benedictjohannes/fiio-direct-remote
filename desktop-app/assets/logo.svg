<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f29"/>
      <stop offset="100%" stop-color="#0e0f14"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4d68"/>
      <stop offset="50%" stop-color="#2a2c3d"/>
      <stop offset="100%" stop-color="#1a1b24"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdf79"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" ry="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Inner Ring Accent -->
  <rect x="12" y="12" width="104" height="104" rx="22" ry="22" fill="none" stroke="#252736" stroke-width="1.5"/>

  <!-- Text Badge (2 lines: FiiO / RMT) -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Top Line: FiiO in iconic crimson red / coral -->
    <text x="64" y="55" font-size="36" font-weight="900" fill="#e74c3c" letter-spacing="1.5">FiiO</text>
    <!-- Bottom Line: RMT in warm metallic audiophile gold -->
    <text x="64" y="96" font-size="34" font-weight="800" fill="url(#goldGrad)" letter-spacing="2">RMT</text>
  </g>
</svg>
