name: Release Android App

on:
  push:
    branches:
      - master
    paths:
      - "android-app/**"
      - ".github/workflows/release-android.yml"

jobs:
  release:
    name: Build and Release Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Run Unit Tests
        run: |
          cd android-app
          ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease

      - name: Prepare APK for Release
        run: |
          mkdir -p dist
          # Copy release APK (or debug APK if unsigned) to release dist folder
          if [ -f "android-app/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android-app/app/build/outputs/apk/release/app-release.apk dist/fiio-direct-remote.apk
          elif [ -f "android-app/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android-app/app/build/outputs/apk/release/app-release-unsigned.apk dist/fiio-direct-remote.apk
          else
            # Fallback to debug build if assembleRelease output pattern differs
            cd android-app && ./gradlew assembleDebug && cd ..
            cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/fiio-direct-remote.apk
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: "FiiO Direct Remote Android App (Latest)"
          body: |
            Automated release build for FiiO Direct Remote Android App.
            
            ### Installation:
            Download and install `fiio-direct-remote.apk` on your Android device (Android 8.0+ / API 26+).
          draft: false
          prerelease: false
          files: |
            dist/fiio-direct-remote.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
